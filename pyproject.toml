[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "move-out-sale"
version = "0.1.0"
description = "A simple website served by FastAPI"
requires-python = ">=3.13"
dependencies = [
    "fastapi",
    "uvicorn[standard]",
    "jinja2",
    "aiofiles",
    "Pillow",
    "pillow-heif",
    "python-multipart",
]

[project.optional-dependencies]
dev = [
    "pre-commit",
    "ruff",
]

[tool.hatch.build.targets.wheel]
packages = ["src"]

[tool.ruff]
src = ["src"]
line-length = 120

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]
